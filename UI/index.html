<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Moorchid · 专属人生档案馆 — 你的专属情绪档案、记忆索引与诗意周报。"
    />
    <meta name="theme-color" content="#0B0C0F" />
    <title>Moorchid · 情绪兰花</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Caveat:wght@400;500;600;700&display=swap"
      rel="preload"
      as="style"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Caveat:wght@400;500;600;700&display=swap"
    />
    <!-- Greeting font: Libertinus Serif, used for "To my friend".
         Pulled in via a separate request so the main css2 above isn't
         polluted with families that no other component uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="preload"
      as="style"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <!-- Heroic-font preload: Long Cang drives the card title.
         Force the browser to request its woff2 file as soon as possible. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/longcang/v4/LYj3dXyUaa9Nt3v1Lr8-CgvHpevY.woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
